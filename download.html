<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Video</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    video {
      width: 100%;
      max-height: 80vh;
      background: #000;
      border-radius: 10px;
    }

    h1 {
      font-size: 20px;
    }

    .info {
      color: #aaa;
      margin-bottom: 20px;
    }

    .download {
      display: inline-block;
      background: #fff;
      color: #111;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
    }

    .error {
      text-align: center;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="content">
    <p>Memuat video...</p>
  </div>

</div>

<script>

const JSON_URL = "/videos.json";

/*
  Contoh URL:

  download.hereclicked.my.id/7BdhzE

  ID yang diambil:
  7BdhzE
*/

function getVideoID() {

  const path = window.location.pathname
    .replace(/^\/+|\/+$/g, "");

  return decodeURIComponent(
    path.split("/").pop()
  );
}


async function loadVideo() {

  const id = getVideoID();

  if (!id) {
    showError("ID video tidak ditemukan.");
    return;
  }

  try {

    const response = await fetch(
      JSON_URL,
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("videos.json gagal dimuat");
    }

    const videos = await response.json();

    const video = videos.find(
      item => String(item.id) === String(id)
    );

    if (!video) {
      showError("Video tidak ditemukan.");
      return;
    }

    document.getElementById("content").innerHTML = `

      <video
        controls
        controlsList="nodownload"
        playsinline
        src="${video.cdn}">
      </video>

      <h1>
        ${video.title || "Video"}
      </h1>

      <div class="info">
        ${video.views || 0} views
      </div>

      <a
        class="download"
        href="${video.cdn}"
        download
        target="_blank">
        ↓ Download Video
      </a>

    `;

  } catch (error) {

    console.error(error);

    showError(
      "Terjadi kesalahan saat memuat video."
    );
  }
}


function showError(message) {

  document.getElementById("content").innerHTML = `
    <div class="error">
      <h2>${message}</h2>
    </div>
  `;

}


loadVideo();

</script>

</body>
</html>
