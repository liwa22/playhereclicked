<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Video</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    height:86px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    width:100%;
    max-width:900px;
    padding:0 15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:14px;
    background:#fff;
    color:#7359d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.appinfo{
    flex:1;
}

.appname{
    font-size:20px;
    font-weight:bold;
}

.subtitle{
    color:#aaa;
    font-size:14px;
    margin-top:4px;
}

.openapp{
    border:0;
    background:#1da1f2;
    color:white;
    border-radius:30px;
    padding:15px 23px;
    font-size:16px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.player{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    position:relative;
}

video{
    width:100%;
    height:100%;
    background:#000;
}

.download{
    position:absolute;
    top:20px;
    right:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid #555;
    background:#222d;
    color:white;
    font-size:28px;
}

.content{
    padding:18px;
}

.title{
    font-size:20px;
    font-weight:bold;
    line-height:1.35;
}

.views{
    color:#888;
    font-size:14px;
    margin-top:8px;
}

.buttons{
    display:flex;
    gap:12px;
    margin:22px 0;
}

.btn{
    padding:12px 24px;
    border-radius:28px;
    border:1px solid #34485e;
    background:#080808;
    color:white;
}

.btn.blue{
    color:#36b7f5;
    border-color:#1688c9;
}

.collection{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:#151515;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
}

.thumb{
    aspect-ratio:16/9;
    background:#252525;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cardbody{
    padding:10px;
}

.cardtitle{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:14px;
}

.cardviews{
    color:#777;
    font-size:12px;
    margin-top:6px;
}

@media(max-width:600px){

    .content{
        padding:15px;
    }

    .title{
        font-size:18px;
    }

    .grid{
        gap:14px;
    }

    .openapp{
        padding:14px 18px;
    }
}
</style>
</head>

<body>

<header class="header">

<div class="app">

<div class="logo">P</div>

<div class="appinfo">
<div class="appname">PulsePlayer</div>
<div class="subtitle">Install app to save videos</div>
</div>

<button class="openapp">
Open App
</button>

</div>

</header>


<main class="container">

<div class="player">

<video id="player" controls playsinline></video>

<button class="download" onclick="downloadVideo()">
↓
</button>

</div>


<div class="content">

<div id="title" class="title">
Memuat video...
</div>

<div id="views" class="views">
◉ 0 views
</div>


<div class="buttons">

<button class="btn" onclick="shareVideo()">
Share
</button>

<button class="btn blue">
Open App
</button>

</div>


<div class="collection">

<span id="collection">
Videos
</span>

<span id="total">
0 videos
</span>

</div>


<div id="grid" class="grid"></div>

</div>

</main>


<script>

let current = null;
let videos = [];


/*
Ambil ID dari URL

Contoh:

domain.com/7BdhzE

hasil:
7BdhzE
*/

function getID(){

    let path = location.pathname;

    path = path
        .replace(/^\/+/,'')
        .replace(/\/+$/,'');

    return decodeURIComponent(
        path.split('/').pop()
    );
}


/*
Load JSON
*/

async function loadVideos(){

    try{

        const response =
            await fetch('/videos.json');

        if(!response.ok)
            throw new Error();

        videos =
            await response.json();


        const id = getID();


        current =
            videos.find(
                v => String(v.id) === String(id)
            );


        if(!current){

            document.getElementById('title')
                .textContent =
                'Video tidak ditemukan';

            return;
        }


        showVideo();

        showRelated();

    }catch(error){

        document.getElementById('title')
            .textContent =
            'Gagal membaca videos.json';

    }

}


/*
Tampilkan video utama
*/

function showVideo(){

    const player =
        document.getElementById('player');


    player.src =
        current.cdn;


    document.title =
        current.title || current.id;


    document.getElementById('title')
        .textContent =
        current.title || current.id;


    document.getElementById('views')
        .textContent =
        '◉ ' +
        Number(current.views || 0)
        .toLocaleString('en-US') +
        ' views';


    document.getElementById('collection')
        .textContent =
        current.collection || 'Videos';


    document.getElementById('total')
        .textContent =
        (current.total_videos || videos.length) +
        ' videos';

}


/*
Video terkait
*/

function showRelated(){

    const grid =
        document.getElementById('grid');

    grid.innerHTML = '';


    let related =
        videos.filter(
            v => v.id !== current.id
        ).slice(0,20);


    related.forEach(video => {

        const card =
            document.createElement('div');

        card.className = 'card';


        card.onclick = function(){

            location.href =
                '/' +
                encodeURIComponent(video.id);

        };


        let thumbnail = '';

        if(video.thumbnail){

            thumbnail =
                `<img src="${video.thumbnail}" loading="lazy">`;

        }


        card.innerHTML = `

            <div class="thumb">
                ${thumbnail}
            </div>

            <div class="cardbody">

                <div class="cardtitle">
                    ${video.title || video.id}
                </div>

                <div class="cardviews">
                    ${Number(video.views || 0).toLocaleString('en-US')}
                    views
                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}


/*
Share
*/

async function shareVideo(){

    const url =
        location.href;


    if(navigator.share){

        await navigator.share({
            title:current.title,
            url:url
        });

    }else{

        await navigator.clipboard.writeText(url);

        alert('Link berhasil disalin');

    }

}


/*
Download
*/

function downloadVideo(){

    if(!current || !current.cdn)
        return;


    window.open(
        current.cdn,
        '_blank'
    );

}


loadVideos();

</script>

</body>
</html>
