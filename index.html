<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Video Player</title>

<!-- Video.js -->
<link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet">

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  width:100%;
  height:100%;
}

.video-js{
  width:100%;
  height:100vh;
  background:#000;
}

.vjs-tech{
  object-fit:contain;
}
</style>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2EMZHLZYX6"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments)}
gtag('js',new Date());
gtag('config','G-2EMZHLZYX6');
</script>

</head>

<body>

<video
  id="my-video"
  class="video-js vjs-big-play-centered"
  playsinline
  preload="metadata">
</video>

<!-- Video.js -->
<script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

<script>

const JSON_URL="videos.json";

const DIRECT_LINK=
"https://countyrecyclefailed.com/cb4srb0u?key=88e9324fbaef4acbebba658e75a35351";

let clicked=false;
let redirected=false;

/* Ambil ID dari URL */
const path=location.hash.slice(1)||location.pathname;

const id=decodeURIComponent(
  path.replace(/^\/+/,"")
);

/* Buat Video.js player */
const player=videojs("my-video",{

  controls:true,

  autoplay:false,

  preload:"metadata",

  fluid:true,

  responsive:true,

  controlBar:{
    children:[
      "playToggle",
      "progressControl",
      "currentTimeDisplay",
      "timeDivider",
      "durationDisplay",
      "volumePanel",
      "fullscreenToggle"
    ]
  }

});


/* Ambil video dari JSON */
fetch(JSON_URL)

.then(res=>res.json())

.then(data=>{

  const selected=data.videos.find(
    v=>v.id===id
  );

  if(!selected){

    document.body.innerHTML=
      "<h1 style='color:white;text-align:center'>Video tidak ditemukan</h1>";

    return;
  }

  /* Masukkan CDN ke Video.js */
  player.src({
    src:selected.cdn,
    type:"video/mp4"
  });

});


/* Klik pertama */
player.on("click",()=>{

  if(!clicked){

    clicked=true;

    window.location.href=DIRECT_LINK;

  }

});


/* Redirect setelah 30 detik */
player.on("timeupdate",()=>{

  if(
    !redirected &&
    player.currentTime()>=30
  ){

    redirected=true;

    window.location.href=DIRECT_LINK;

  }

});

</script>

</body>
</html>
