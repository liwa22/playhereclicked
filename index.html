<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stream Video</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{min-height:100vh}

.topbar{
    height:86px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.appbar{
    width:100%;
    max-width:900px;
    padding:0 18px;
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:56px;
    height:56px;
    flex:none;
    border-radius:14px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:900;
    color:#7359d8;
}

.app-info{
    flex:1;
    min-width:0;
}

.app-name{
    font-size:20px;
    font-weight:700;
    margin-bottom:3px;
}

.app-subtitle{
    color:#aaa;
    font-size:14px;
}

.open-app{
    border:0;
    border-radius:30px;
    background:#1da1f2;
    color:#fff;
    padding:15px 24px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

/* VIDEO */

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    user-select:none;
}

#video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}

/* CUSTOM CONTROLS */

.video-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:35px 14px 12px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.82)
    );
    display:flex;
    align-items:center;
    gap:10px;
    opacity:1;
    transition:opacity .25s ease;
    z-index:5;
}

.video-wrapper.hide-controls .video-controls{
    opacity:0;
    pointer-events:none;
}

.control-btn{
    width:38px;
    height:38px;
    flex:none;
    padding:0;
    border:0;
    background:transparent;
    color:#fff;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.progress{
    flex:1;
    min-width:50px;
    height:5px;
    margin:0;
    padding:0;
    accent-color:#fff;
    cursor:pointer;
}

.time{
    flex:none;
    color:#fff;
    font-size:12px;
    white-space:nowrap;
    min-width:75px;
    text-align:center;
}

/* PLAY BUTTON DI TENGAH */

.center-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:70px;
    height:70px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:4;
    transition:opacity .2s ease,transform .2s ease;
}

.video-wrapper.playing .center-play{
    opacity:0;
    pointer-events:none;
}

.video-wrapper.hide-controls .center-play{
    opacity:0;
    pointer-events:none;
}

/* CONTENT */

.content{
    padding:18px 18px 35px;
}

.title{
    font-size:20px;
    font-weight:700;
    line-height:1.35;
    margin-bottom:8px;
}

.views{
    color:#888;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:12px;
    margin:22px 0 18px;
}

.button{
    border:1px solid #30445d;
    background:#080808;
    color:white;
    border-radius:28px;
    padding:12px 24px;
    font-size:14px;
    cursor:pointer;
}

.button.open{
    border-color:#1688c9;
    color:#35b1f5;
}

.collection-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:10px 0 15px;
    font-size:16px;
    font-weight:700;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
}

.card{
    min-width:0;
    background:#151515;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease;
}

.card:hover{
    transform:translateY(-2px);
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#252525;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card-info{
    padding:10px 11px 12px;
}

.card-title{
    color:#eee;
    font-size:14px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-views{
    color:#777;
    font-size:12px;
    margin-top:6px;
}

.message{
    padding:70px 20px;
    text-align:center;
    color:#888;
}

@media(max-width:600px){

    .topbar{
        height:86px;
    }

    .appbar{
        padding:0 14px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .app-name{
        font-size:19px;
    }

    .app-subtitle{
        font-size:13px;
    }

    .open-app{
        padding:14px 20px;
    }

    .content{
        padding:17px 14px 30px;
    }

    .title{
        font-size:18px;
    }

    .video-grid{
        gap:14px;
    }

    .video-controls{
        padding:30px 8px 8px;
        gap:5px;
    }

    .control-btn{
        width:36px;
        height:36px;
        font-size:20px;
    }

    .time{
        font-size:11px;
        min-width:65px;
    }

    .progress{
        height:4px;
    }

    .center-play{
        width:62px;
        height:62px;
        font-size:27px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="appbar">

        <div class="logo">P</div>

        <div class="app-info">
            <div class="app-name">PulsePlayer</div>
            <div class="app-subtitle">Install app to save videos</div>
        </div>

        <button class="open-app" onclick="openApp()">
            Open App
        </button>

    </div>
</header>


<main class="container">

<section class="video-wrapper" id="videoWrapper">

    <!-- TIDAK ADA CONTROLS BAWAAN -->
    <video
        id="video"
        playsinline
        preload="metadata"
        disablePictureInPicture
        controlsList="nodownload">
    </video>


    <!-- PLAY TENGAH -->
    <button
        id="centerPlay"
        class="center-play"
        aria-label="Play">
        ▶
    </button>


    <!-- CUSTOM CONTROLS -->
    <div class="video-controls">

        <button
            id="playBtn"
            class="control-btn"
            aria-label="Play">
            ▶
        </button>

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1">

        <span
            id="time"
            class="time">
            0:00 / 0:00
        </span>

        <button
            id="muteBtn"
            class="control-btn"
            aria-label="Mute">
            🔊
        </button>

        <button
            id="fullscreenBtn"
            class="control-btn"
            aria-label="Fullscreen">
            ⛶
        </button>

    </div>

</section>


<section class="content">

    <div id="title" class="title">
        Memuat video...
    </div>

    <div id="views" class="views">
        ◉ 0 views
    </div>


    <div class="buttons">

        <button class="button" onclick="shareVideo()">
            Share
        </button>

        <button class="button open" onclick="openApp()">
            Open App
        </button>

    </div>


    <div class="collection-header">
        <span id="collection">Videos</span>
        <span id="total">0 videos</span>
    </div>


    <div id="videoGrid" class="video-grid"></div>

</section>

</main>


<script>

const JSON_URL = "videos.json";

let currentVideo = null;
let allVideos = [];

const video = document.getElementById("video");
const videoWrapper = document.getElementById("videoWrapper");
const playBtn = document.getElementById("playBtn");
const centerPlay = document.getElementById("centerPlay");
const progress = document.getElementById("progress");
const time = document.getElementById("time");
const muteBtn = document.getElementById("muteBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

let hideTimer;


/* =========================
   URL VIDEO ID
========================= */

function getVideoId(){

    const path = window.location.pathname
        .replace(/^\/+|\/+$/g,"");

    if(path){
        return decodeURIComponent(
            path.split("/").pop()
        );
    }

    const params =
        new URLSearchParams(location.search);

    return params.get("id");
}


/* =========================
   FORMAT VIEWS
========================= */

function formatViews(number){

    return Number(number || 0)
        .toLocaleString("en-US");

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

    if(!Number.isFinite(seconds)){
        return "0:00";
    }

    seconds = Math.floor(seconds);

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor((seconds % 3600) / 60);

    const secs =
        seconds % 60;

    if(hours > 0){

        return hours + ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0");

    }

    return minutes + ":" +
        String(secs).padStart(2,"0");

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(video.paused){

        video.play().catch(()=>{});

    }else{

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();
        togglePlay();
        showControls();

    }
);


centerPlay.addEventListener(
    "click",
    function(e){

        e.stopPropagation();
        togglePlay();

    }
);


video.addEventListener(
    "play",
    function(){

        playBtn.textContent = "❚❚";
        centerPlay.textContent = "❚❚";

        videoWrapper.classList.add("playing");

        startHideTimer();

    }
);


video.addEventListener(
    "pause",
    function(){

        playBtn.textContent = "▶";
        centerPlay.textContent = "▶";

        videoWrapper.classList.remove("playing");

        showControls();

    }
);


/* =========================
   TAP VIDEO
========================= */

video.addEventListener(
    "click",
    function(){

        if(video.paused){

            togglePlay();

        }else{

            showControls();

        }

    }
);


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    function(){

        if(!video.duration) return;

        const value =
            (video.currentTime /
            video.duration) * 100;

        progress.value = value;

        time.textContent =
            formatTime(video.currentTime) +
            " / " +
            formatTime(video.duration);

    }
);


video.addEventListener(
    "loadedmetadata",
    function(){

        time.textContent =
            "0:00 / " +
            formatTime(video.duration);

    }
);


progress.addEventListener(
    "input",
    function(){

        if(!video.duration) return;

        video.currentTime =
            (progress.value / 100) *
            video.duration;

        showControls();

    }
);


/* =========================
   MUTE
========================= */

muteBtn.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        video.muted = !video.muted;

        muteBtn.textContent =
            video.muted ? "🔇" : "🔊";

        showControls();

    }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener(
    "click",
    async function(e){

        e.stopPropagation();

        try{

            if(!document.fullscreenElement){

                await videoWrapper.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            /*
            Fallback untuk browser
            yang tidak mendukung fullscreen.
            */

            if(video.webkitEnterFullscreen){

                video.webkitEnterFullscreen();

            }

        }

        showControls();

    }
);


/* =========================
   FULLSCREEN ICON
========================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        fullscreenBtn.textContent =
            document.fullscreenElement
            ? "⛶"
            : "⛶";

    }
);


/* =========================
   AUTO HIDE CONTROLS
========================= */

function startHideTimer(){

    clearTimeout(hideTimer);

    hideTimer =
        setTimeout(
            function(){

                if(!video.paused){

                    videoWrapper
                        .classList
                        .add("hide-controls");

                }

            },
            2500
        );

}


function showControls(){

    videoWrapper
        .classList
        .remove("hide-controls");

    clearTimeout(hideTimer);

    if(!video.paused){

        startHideTimer();

    }

}


videoWrapper.addEventListener(
    "mousemove",
    showControls
);

videoWrapper.addEventListener(
    "touchstart",
    showControls,
    {passive:true}
);


/* =========================
   LOAD JSON
========================= */

async function loadVideos(){

    try{

        const response =
            await fetch(
                JSON_URL,
                {cache:"no-cache"}
            );

        if(!response.ok){

            throw new Error(
                "JSON tidak dapat dibuka"
            );

        }

        allVideos =
            await response.json();

        const id = getVideoId();

        currentVideo =
            allVideos.find(
                video =>
                    String(video.id) ===
                    String(id)
            );

        if(!currentVideo){

            showError(
                "Video tidak ditemukan."
            );

            return;

        }

        renderVideo(currentVideo);

        renderRelated(currentVideo);

    }catch(error){

        console.error(error);

        showError(
            "Gagal membaca videos.json"
        );

    }

}


/* =========================
   RENDER VIDEO
========================= */

function renderVideo(videoData){

    document.title =
        videoData.title ||
        "Stream Video";

    document.getElementById("title")
        .textContent =
        videoData.title ||
        videoData.id;

    document.getElementById("views")
        .textContent =
        "◉ " +
        formatViews(videoData.views) +
        " views";

    document.getElementById("collection")
        .textContent =
        videoData.collection ||
        "Videos";

    document.getElementById("total")
        .textContent =
        (videoData.total_videos ||
        allVideos.length) +
        " videos";

    video.src = videoData.cdn;

    if(videoData.thumbnail){

        video.poster =
            videoData.thumbnail;

    }

}


/* =========================
   RELATED VIDEOS
========================= */

function renderRelated(current){

    const grid =
        document.getElementById(
            "videoGrid"
        );

    grid.innerHTML = "";

    let related = [];


    if(Array.isArray(current.related)){

        related =
            current.related
                .map(id =>
                    allVideos.find(
                        video =>
                            String(video.id) ===
                            String(id)
                    )
                )
                .filter(Boolean);

    }


    if(!related.length){

        related =
            allVideos
                .filter(video =>
                    String(video.id) !==
                    String(current.id)
                )
                .slice(0,20);

    }


    related.forEach(videoData => {

        const card =
            document.createElement(
                "article"
            );

        card.className = "card";


        card.onclick = function(){

            window.location.href =
                "/" +
                encodeURIComponent(
                    videoData.id
                );

        };


        const thumbnail =
            document.createElement(
                "div"
            );

        thumbnail.className =
            "thumbnail";


        if(videoData.thumbnail){

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                videoData.thumbnail;

            img.loading = "lazy";

            thumbnail.appendChild(img);

        }


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "card-info";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "card-title";

        title.textContent =
            videoData.title ||
            videoData.id;


        const views =
            document.createElement(
                "div"
            );

        views.className =
            "card-views";

        views.textContent =
            formatViews(
                videoData.views
            ) +
            " views";


        info.appendChild(title);

        info.appendChild(views);

        card.appendChild(thumbnail);

        card.appendChild(info);

        grid.appendChild(card);

    });

}


/* =========================
   SHARE
========================= */

async function shareVideo(){

    const url =
        window.location.href;

    if(navigator.share){

        try{

            await navigator.share({

                title:
                    currentVideo?.title ||
                    "Video",

                url:url

            });

        }catch(e){}

    }else{

        try{

            await navigator.clipboard
                .writeText(url);

            alert(
                "Link berhasil disalin."
            );

        }catch(e){

            prompt(
                "Salin link ini:",
                url
            );

        }

    }

}


/* =========================
   OPEN APP
========================= */

function openApp(){

    alert(
        "Open App belum dikonfigurasi."
    );

}


/* =========================
   ERROR
========================= */

function showError(text){

    document.querySelector(
        ".video-wrapper"
    ).innerHTML =
        '<div class="message">' +
        text +
        '</div>';

    document.getElementById(
        "title"
    ).textContent = text;

}


/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
