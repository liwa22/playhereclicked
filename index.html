<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stream Video</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.topbar{
    height:86px;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.appbar{
    width:100%;
    max-width:900px;
    padding:0 18px;
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:56px;
    height:56px;
    flex:none;
    border-radius:14px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:900;
    color:#7359d8;
}

.app-info{
    flex:1;
    min-width:0;
}

.app-name{
    font-size:20px;
    font-weight:700;
    margin-bottom:3px;
}

.app-subtitle{
    color:#aaa;
    font-size:14px;
}

.open-app{
    border:0;
    border-radius:30px;
    background:#1da1f2;
    color:#fff;
    padding:15px 24px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    overflow:hidden;
    user-select:none;
}

#video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    cursor:pointer;
}

/*
=========================================
CUSTOM CONTROLS (tanpa library luar)
=========================================
*/
.custom-controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0));
    opacity:1;
    transition:opacity .25s ease;
    z-index:3;
}

.custom-controls.hidden{
    opacity:0;
    pointer-events:none;
}

.ctrl-btn{
    background:transparent;
    border:0;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
    flex:none;
}

.time-label{
    color:#ddd;
    font-size:12px;
    flex:none;
    min-width:38px;
    text-align:center;
}

.seek-bar{
    flex:1;
    height:4px;
    cursor:pointer;
    accent-color:#1688c9;
}

.vol-bar{
    width:70px;
    height:4px;
    cursor:pointer;
    accent-color:#1688c9;
}

@media(max-width:600px){
    .vol-bar{
        display:none;
    }
    .ctrl-btn{
        font-size:18px;
    }
}

.big-play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:66px;
    height:66px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    border:0;
    color:#fff;
    font-size:26px;
    cursor:pointer;
    z-index:3;
}

.big-play.hidden{
    display:none;
}

.download-btn{
    position:absolute;
    right:18px;
    top:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    border:1px solid #555;
    background:rgba(35,35,35,.88);
    color:white;
    font-size:27px;
    cursor:pointer;
    z-index:4;
}

.content{
    padding:18px 18px 35px;
}

.title{
    font-size:20px;
    font-weight:700;
    line-height:1.35;
    margin-bottom:8px;
}

.views{
    color:#888;
    font-size:14px;
}

.buttons{
    display:flex;
    gap:12px;
    margin:22px 0 18px;
}

.button{
    border:1px solid #30445d;
    background:#080808;
    color:white;
    border-radius:28px;
    padding:12px 24px;
    font-size:14px;
    cursor:pointer;
}

.button.open{
    border-color:#1688c9;
    color:#35b1f5;
}

.collection-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:10px 0 15px;
    font-size:16px;
    font-weight:700;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:16px;
}

.card{
    min-width:0;
    background:#151515;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease;
}

.card:hover{
    transform:translateY(-2px);
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#252525;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card-info{
    padding:10px 11px 12px;
}

.card-title{
    color:#eee;
    font-size:14px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-views{
    color:#777;
    font-size:12px;
    margin-top:6px;
}

.message{
    padding:70px 20px;
    text-align:center;
    color:#888;
}

@media(max-width:600px){
    .topbar{
        height:86px;
    }

    .appbar{
        padding:0 14px;
    }

    .logo{
        width:55px;
        height:55px;
    }

    .app-name{
        font-size:19px;
    }

    .app-subtitle{
        font-size:13px;
    }

    .open-app{
        padding:14px 20px;
    }

    .content{
        padding:17px 14px 30px;
    }

    .title{
        font-size:18px;
    }

    .video-grid{
        gap:14px;
    }

    .download-btn{
        width:58px;
        height:58px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="appbar">

        <div class="logo">P</div>

        <div class="app-info">
            <div class="app-name">PulsePlayer</div>
            <div class="app-subtitle">Install app to save videos</div>
        </div>

        <button class="open-app" onclick="openApp()">
            Open App
        </button>

    </div>
</header>


<main class="container">

    <section class="video-wrapper" id="videoWrapper">

        <!--
        TIDAK ADA atribut "controls" sama sekali.
        Semua tombol di bawah ini dibuat manual pakai JS,
        tidak ada library luar, tidak ada tombol download bawaan browser.
        -->
        <video
            id="video"
            playsinline
            preload="metadata"
            disablePictureInPicture
            controlsList="nodownload noremoteplayback"
            oncontextmenu="return false">
        </video>

        <button
            class="download-btn"
            onclick="downloadVideo()"
            title="Download">
            ↓
        </button>

    </section>


    <section class="content">

        <div id="title" class="title">
            Memuat video...
        </div>

        <div id="views" class="views">
            ◉ 0 views
        </div>


        <div class="buttons">

            <button class="button" onclick="shareVideo()">
                Share
            </button>

            <button class="button open" onclick="openApp()">
                Open App
            </button>

        </div>


        <div class="collection-header">
            <span id="collection">Videos</span>
            <span id="total">0 videos</span>
        </div>


        <div id="videoGrid" class="video-grid"></div>

    </section>

</main>


<!-- Fluid Player: library video player open-source & gratis, via CDN -->
<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

<script>

/*
====================================================
KONFIGURASI
====================================================
File JSON harus berada di:
https://domainanda.com/videos.json

Contoh URL halaman:
https://domainanda.com/7BdhzE
ID akan diambil dari bagian terakhir URL.
*/

const JSON_URL = "videos.json";

let currentVideo = null;
let allVideos = [];

const video = document.getElementById("video");
let fluidInstance = null;

/*
====================================================
FLUID PLAYER
====================================================
Inisialisasi sekali saja, setelah src video diset di
renderVideo(). Fluid Player pakai skin custom sendiri,
tidak ada tombol download di kontrolnya secara default.
*/
function initFluidPlayer(){

    if(fluidInstance) return; // sudah pernah diinit, jangan dobel

    fluidInstance = fluidPlayer("video", {
        layoutControls: {
            fillToContainer: true,
            playButtonShowing: true,
            playPauseAnimation: true,
            autoPlay: false,
            mute: false,
            doubleclickFullscreen: true,
            controlBar: {
                autoHide: true,
                autoHideTimeout: 3,
                animated: true
            },
            allowDownload: false, // eksplisit matikan opsi download di UI
            playbackRateEnabled: true,
            allowTheatre: false,
            keyboardControl: true,
            contextMenu: {
                controls: false, // sembunyikan menu klik-kanan bawaan Fluid Player juga
                links: []
            }
        }
    });

}


/*
Ambil ID dari URL.
domain.com/7BdhzE -> 7BdhzE
*/
function getVideoId(){

    const path = window.location.pathname
        .replace(/^\/+|\/+$/g,"");

    if(path){
        return decodeURIComponent(path.split("/").pop());
    }

    const params = new URLSearchParams(location.search);

    return params.get("id");
}


function formatViews(number){
    return Number(number || 0).toLocaleString("en-US");
}


async function loadVideos(){

    try{

        const response = await fetch(JSON_URL, {
            cache:"no-cache"
        });

        if(!response.ok){
            throw new Error("JSON tidak dapat dibuka");
        }

        allVideos = await response.json();

        const id = getVideoId();

        currentVideo = allVideos.find(
            v => String(v.id) === String(id)
        );

        if(!currentVideo){
            showError("Video tidak ditemukan.");
            return;
        }

        renderVideo(currentVideo);
        renderRelated(currentVideo);

    }catch(error){
        console.error(error);
        showError("Gagal membaca videos.json");
    }
}


function renderVideo(v){

    document.title = v.title || "Stream Video";

    document.getElementById("title").textContent = v.title || v.id;

    document.getElementById("views").textContent =
        "◉ " + formatViews(v.views) + " views";

    document.getElementById("collection").textContent =
        v.collection || "Videos";

    document.getElementById("total").textContent =
        (v.total_videos || allVideos.length) + " videos";

    video.src = v.cdn;

    if(v.thumbnail){
        video.poster = v.thumbnail;
    }

    initFluidPlayer();

}


function renderRelated(current){

    const grid = document.getElementById("videoGrid");
    grid.innerHTML = "";

    let related = [];

    if(Array.isArray(current.related)){
        related = current.related
            .map(id => allVideos.find(v => String(v.id) === String(id)))
            .filter(Boolean);
    }

    if(!related.length){
        related = allVideos
            .filter(v => String(v.id) !== String(current.id))
            .slice(0,20);
    }

    related.forEach(v => {

        const card = document.createElement("article");
        card.className = "card";
        card.onclick = () => {
            window.location.href = "/" + encodeURIComponent(v.id);
        };

        const thumbnail = document.createElement("div");
        thumbnail.className = "thumbnail";

        if(v.thumbnail){
            const img = document.createElement("img");
            img.src = v.thumbnail;
            img.loading = "lazy";
            thumbnail.appendChild(img);
        }

        const info = document.createElement("div");
        info.className = "card-info";

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = v.title || v.id;

        const views = document.createElement("div");
        views.className = "card-views";
        views.textContent = formatViews(v.views) + " views";

        info.appendChild(title);
        info.appendChild(views);
        card.appendChild(thumbnail);
        card.appendChild(info);
        grid.appendChild(card);

    });

}


async function shareVideo(){

    const url = window.location.href;

    if(navigator.share){
        try{
            await navigator.share({
                title: currentVideo?.title || "Video",
                url:url
            });
        }catch(e){}
    }else{
        try{
            await navigator.clipboard.writeText(url);
            alert("Link berhasil disalin.");
        }catch(e){
            prompt("Salin link ini:", url);
        }
    }

}


function downloadVideo(){

    if(!currentVideo?.cdn) return;

    const link = document.createElement("a");
    link.href = currentVideo.cdn;
    link.target = "_blank";
    link.rel = "noopener";
    link.download = currentVideo.id + ".mp4";

    document.body.appendChild(link);
    link.click();
    link.remove();

}


function openApp(){
    alert("Open App belum dikonfigurasi.");
}


function showError(text){

    document.getElementById("videoWrapper").innerHTML =
        '<div class="message">' + text + '</div>';

    document.getElementById("title").textContent = text;

}


loadVideos();

</script>

</body>
</html>
