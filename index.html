<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Penting untuk bypass proteksi hotlink Videy.co / CDN external -->
<meta name="referrer" content="no-referrer">
<title>DOODSTREAM PRO MILD</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
.app-title {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
}
.feed-container {
  height: 100vh;
  width: 100vw;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.video-card {
  position: relative;
  width: 100%;
  height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.status-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #aaa;
  font-size: 14px;
  text-align: center;
  pointer-events: none;
  background: rgba(0,0,0,0.6);
  padding: 8px 16px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="app-title">DOODSTREAM PRO MILD</div>
<div class="feed-container" id="feed"></div>

<script>
(async () => {
  const feed = document.getElementById("feed");
  const url = new URL(location.href);

  // Ambil ID dari URL (?v=, #, atau pathname)
  let targetId = url.searchParams.get("v") || 
                 (location.hash ? decodeURIComponent(location.hash.replace(/^#\/?/, "")) : null) || 
                 decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
  if (targetId === "404.html") targetId = null;

  // Fungsi acak array (Fisher-Yates)
  const shuffle = (array) => {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  };

  try {
    const res = await fetch("/Video.json");
    if (!res.ok) throw new Error("Gagal memuat JSON");

    const data = await res.json();
    let videos = data.videos ? data.videos.filter(v => v && v.cdn) : [];

    if (videos.length === 0) {
      feed.innerHTML = `<div class="status-msg">Video tidak ditemukan.</div>`;
      return;
    }

    // Acak urutan video
    videos = shuffle(videos);

    // Pindahkan video target ke urutan pertama jika ada ID di URL
    if (targetId) {
      const targetIndex = videos.findIndex(v => String(v.id).trim() === String(targetId).trim());
      if (targetIndex !== -1) {
        const [targetVideo] = videos.splice(targetIndex, 1);
        videos.unshift(targetVideo);
      }
    }

    // Render ke DOM
    videos.forEach((v) => {
      const card = document.createElement("div");
      card.className = "video-card";
      
      const videoEl = document.createElement("video");
      videoEl.src = v.cdn;
      videoEl.controls = true;
      videoEl.playsInline = true;
      videoEl.preload = "metadata";
      videoEl.loop = true;
      videoEl.muted = true; // Muted diperlukan agar autoplay diizinkan browser HP/Desktop
      videoEl.referrerPolicy = "no-referrer"; // Wajib agar tidak diblokir oleh CDN Videy/Dood

      const statusEl = document.createElement("div");
      statusEl.className = "status-msg";
      statusEl.textContent = "Memuat video...";

      const hideStatus = () => { statusEl.style.display = "none"; };

      videoEl.addEventListener("canplay", hideStatus);
      videoEl.addEventListener("playing", hideStatus);
      videoEl.addEventListener("error", () => {
        statusEl.style.display = "block";
        statusEl.textContent = "Video gagal dimuat.";
      });

      card.appendChild(videoEl);
      card.appendChild(statusEl);
      feed.appendChild(card);
    });

    // Sensor scroll untuk Autoplay & Auto Pause
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const video = entry.target.querySelector("video");
        if (!video) return;

        if (entry.isIntersecting) {
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              // Jika terhalang kebijakan suara, paksa mute lalu putar ulang
              video.muted = true;
              video.play();
            });
          }
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll(".video-card").forEach(card => observer.observe(card));

  } catch (e) {
    feed.innerHTML = `<div class="status-msg">Gagal memuat file Video.json</div>`;
  }
})();
</script>

</body>
</html>
