<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOODSTREAM PRO MILD</title>  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(50deg, #F9F4FB, #F9F4FB);
      font-family: 'Roboto', sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(170deg, #B772FF, #E682C9);
      color: white;
      padding: 5px;
      text-align: center;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      color: #444;
      margin-bottom: 20px;
    }

    .video-container {
      display: inline-block;
      background-color: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 2px solid #f0f8ff;
      max-width: 100%;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }

    .wa-button2 {
      background: linear-gradient(10deg, #B772FF, #E682C9);
      color: white;
      font-size: 16px;
      padding: 10px 2px;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
      transition: background-color 0.3s ease;
    }

    .wa-button {
      background: linear-gradient(10deg, #F9F4FB, #F9F4FB);
      color: #F9F4FB;
      font-size: 16px;
      padding: 12px 5px;
      font-weight: bold;
      border-radius: 50px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    footer {
      background: linear-gradient(135deg, #B772FF, #E682C9);
      color: white;
      text-align: center;
      padding: 10px 0;
      box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.2);
    }

    footer p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .small-image {
      position: center;
      top: 0;
      left: 0;
      width: 200px;
      height: 100px;
    }

    .small-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head><body>  <!-- Header -->  <header>
    <div class="small-image">
      <img src="IMG_3942.png" alt="Gambar kecil">
    </div>
  </header>  <!-- Main Content -->  <main>
    <h2 id="videoTitle">Loading...</h2><div class="video-container d-none" id="videoContainer">
  <video id="videoPlayer" controls>
    <source id="videoSource" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

  </main>  <!-- WhatsApp Button -->  <div style="position: absolute; top: 95px; right: 20px;">
    <a
      href="https://whatsapp.com/channel/0029VamR5tRDp2QIMDh60E3P"
      class="wa-button"
      target="_blank">
      JOIN CHANNEL WA
    </a>
  </div>  <div style="position: absolute; top: 96px; right: 23px;">
    <a
      href="https://whatsapp.com/channel/0029VamR5tRDp2QIMDh60E3P"
      class="wa-button2"
      target="_blank">
      JOIN CHANNEL WA
    </a>
  </div>  <!-- Footer -->  <footer>
    <p>&copy; 2025 Doodstream Pro Mild. All rights reserved.</p>
  </footer>  <script>
    // Ambil parameter v dari URL
    // Contoh:
    // https://domainanda.com/?v=A7k2Q.mp4

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    if (videoId) {

      // Ambil Video.json dari repo/folder yang sama
      fetch('Video.json')
        .then(response => {

          if (!response.ok) {
            throw new Error('Video.json tidak ditemukan');
          }

          return response.json();
        })

        .then(data => {

          // Format JSON:
          // {
          //   "videos": [
          //     {
          //       "id": "A7k2Q.mp4",
          //       "cdn": "https://cdn2.slicedrive.com/7LPwLvoU1.mp4"
          //     }
          //   ]
          // }

          const videoData = data.videos.find(
            video => video.id === videoId
          );

          if (videoData) {

            // Tampilkan ID/judul video
            document.getElementById('videoTitle').textContent = videoData.id;

            // Masukkan URL CDN ke video player
            document.getElementById('videoSource').src = videoData.cdn;

            // Tampilkan video
            document
              .getElementById('videoContainer')
              .classList.remove('d-none');

            // Reload video player
            document.getElementById('videoPlayer').load();

          } else {

            document.getElementById('videoTitle').textContent =
              'Video not found';

          }

        })

        .catch(error => {

          console.error('Error fetching Video.json:', error);

          document.getElementById('videoTitle').textContent =
            'Failed to load video data';

        });

    } else {

      document.getElementById('videoTitle').textContent =
        'tobatlah wahai anak muda';

    }
  </script>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script></body>
</html>
