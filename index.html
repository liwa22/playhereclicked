<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>DOODSTREAM PRO MILD</title>  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F9F4FB;
      font-family: 'Roboto', sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(170deg, #B772FF, #E682C9);
      padding: 5px;
      text-align: center;
    }

    .small-image {
      width: 200px;
      height: 100px;
      margin: auto;
    }

    .small-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      color: #444;
      margin-bottom: 20px;
    }

    .video-container {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 2px solid #f0f8ff;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      border-radius: 18px;
      background: #000;
    }

    footer {
      background: linear-gradient(135deg, #B772FF, #E682C9);
      color: white;
      text-align: center;
      padding: 10px 0;
    }

    footer p {
      margin: 0;
      font-size: 0.9rem;
    }

    .d-none {
      display: none !important;
    }
  </style>  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head><body><header>
  <div class="small-image">
    <img src="/IMG_3942.png" alt="Gambar">
  </div>
</header><main>  <h2 id="videoTitle">Loading...</h2>  <div class="video-container d-none" id="videoContainer"><video id="videoPlayer" controls playsinline preload="metadata">

  <source id="videoSource" type="video/mp4">

  Browser Anda tidak mendukung video.

</video>

  </div></main><footer>
  <p>&copy; 2025 Doodstream Pro Mild. All rights reserved.</p>
</footer><script>

  /*
   * =====================================================
   * AMBIL ID DARI URL
   *
   * Contoh:
   *
   * https://play.hereclicked.my.id/A7k2Q.mp4
   *
   * pathname:
   * /A7k2Q.mp4
   *
   * ID:
   * A7k2Q.mp4
   * =====================================================
   */

  const path = window.location.pathname;

  const videoId = decodeURIComponent(
    path.substring(1)
  );


  /*
   * Jika membuka domain utama:
   *
   * https://play.hereclicked.my.id/
   *
   * maka tidak ada ID video.
   */

  if (!videoId || videoId === "404.html") {

    document.getElementById("videoTitle").textContent =
      "tobatlah wahai anak muda";

  } else {

    /*
     * Ambil Video.json
     */

    fetch("/Video.json")

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Video.json gagal dimuat. HTTP " + response.status
          );
        }

        return response.json();

      })

      .then(data => {

        /*
         * Format Video.json:
         *
         * {
         *   "videos": [
         *     {
         *       "id": "A7k2Q.mp4",
         *       "cdn": "https://..."
         *     }
         *   ]
         * }
         */

        if (!data.videos || !Array.isArray(data.videos)) {

          throw new Error(
            "Format Video.json salah"
          );

        }


        /*
         * Cari ID video
         */

        const videoData = data.videos.find(
          video => video.id === videoId
        );


        /*
         * Jika ID ditemukan
         */

        if (videoData) {

          document.getElementById("videoTitle").textContent =
            videoData.id;

          document.getElementById("videoSource").src =
            videoData.cdn;

          document.getElementById("videoContainer")
            .classList.remove("d-none");

          document.getElementById("videoPlayer").load();

        }


        /*
         * Jika ID tidak ditemukan
         */

        else {

          document.getElementById("videoTitle").textContent =
            "Video not found";

          console.log(
            "ID tidak ditemukan:",
            videoId
          );

        }

      })


      /*
       * Error
       */

      .catch(error => {

        console.error(
          "Error:",
          error
        );

        document.getElementById("videoTitle").textContent =
          "Failed to load video data";

      });

  }

</script></body>
</html>
