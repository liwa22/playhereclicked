<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOODSTREAM PRO MILD</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
.app-title {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
}
.feed-container {
  height: 100vh;
  width: 100vw;
  overflow-y: mandatory;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.video-card {
  position: relative;
  width: 100%;
  height: 100vh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.status-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #aaa;
  font-size: 14px;
  text-align: center;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="app-title">DOODSTREAM PRO MILD</div>
<div class="feed-container" id="feed"></div>

<script>
(async () => {
  const feed = document.getElementById("feed");
  const url = new URL(location.href);

  // Ambil ID dari query parameter, hash, atau pathname
  let targetId = url.searchParams.get("v");
  if (!targetId && location.hash) {
    targetId = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  }
  if (!targetId) {
    targetId = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
  }
  if (targetId === "404.html") targetId = null;

  // Fungsi mengacak array (Fisher-Yates Shuffle)
  const shuffle = (array) => {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  };

  try {
    const res = await fetch("/Video.json");
    if (!res.ok) throw new Error();

    const data = await res.json();
    let videos = data.videos ? data.videos.filter(v => v && v.cdn) : [];

    if (videos.length === 0) {
      feed.innerHTML = `<div class="status-msg">Video tidak ditemukan.</div>`;
      return;
    }

    // Acak daftar video
    videos = shuffle(videos);

    // Jika ada ID target dari URL, pindahkan video tersebut ke paling atas
    if (targetId) {
      const targetIndex = videos.findIndex(v => String(v.id).trim() === String(targetId).trim());
      if (targetIndex !== -1) {
        const [targetVideo] = videos.splice(targetIndex, 1);
        videos.unshift(targetVideo);
      }
    }

    // Render kartu video ke DOM
    videos.forEach((v) => {
      const card = document.createElement("div");
      card.className = "video-card";
      
      const videoEl = document.createElement("video");
      videoEl.src = v.cdn;
      videoEl.controls = true;
      videoEl.playsInline = true;
      videoEl.preload = "metadata";
      videoEl.loop = true;

      const statusEl = document.createElement("div");
      statusEl.className = "status-msg";
      statusEl.textContent = "Memuat video...";

      videoEl.onloadeddata = () => statusEl.remove();
      videoEl.onerror = () => { statusEl.textContent = "Video gagal dimuat."; };

      card.appendChild(videoEl);
      card.appendChild(statusEl);
      feed.appendChild(card);
    });

    // Fitur Auto Play/Pause berbasis Intersection Observer (Scroll Detection)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const video = entry.target.querySelector("video");
        if (!video) return;

        if (entry.isIntersecting) {
          video.play().catch(() => {
            // Menangani pembatasan autoplay browser jika video bersuara
          });
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll(".video-card").forEach(card => observer.observe(card));

  } catch (e) {
    feed.innerHTML = `<div class="status-msg">Gagal memuat video.</div>`;
  }
})();
</script>

</body>
</html>
